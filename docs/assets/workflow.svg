<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">NIPTScale workflow</title>
  <desc id="desc">Three-stage workflow from lane discovery through alignment to BaseVar2 variant calling.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7c79"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173f38" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#f6f9f8"/>
  <text x="52" y="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#173f38">From sequencing lanes to an indexed BaseVar2 VCF</text>
  <text x="52" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#687b77">Auditable manifests · bounded parallelism · independent stage logs</text>

  <!-- Stage backgrounds -->
  <g filter="url(#shadow)">
    <rect x="42" y="116" width="330" height="382" rx="20" fill="#ffffff" stroke="#d6e3df"/>
    <rect x="392" y="116" width="350" height="382" rx="20" fill="#ffffff" stroke="#d6e3df"/>
    <rect x="762" y="116" width="396" height="382" rx="20" fill="#ffffff" stroke="#d6e3df"/>
  </g>

  <!-- Stage 1 -->
  <circle cx="76" cy="151" r="17" fill="#18594f"/>
  <text x="76" y="157" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="105" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#173f38">DISCOVER</text>

  <rect x="74" y="196" width="266" height="62" rx="12" fill="#eaf3f0" stroke="#9ac0b5"/>
  <text x="207" y="220" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#214f47">Disk / Run / Lane</text>
  <text x="207" y="242" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#5c736f">direct-child *.fq.gz</text>

  <line x1="207" y1="258" x2="207" y2="290" stroke="#6b7c79" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="74" y="298" width="266" height="56" rx="12" fill="#ffffff" stroke="#8aaba3" stroke-width="1.5"/>
  <text x="207" y="332" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#18594f">niptscale scan</text>

  <line x1="207" y1="354" x2="207" y2="384" stroke="#6b7c79" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="74" y="392" width="126" height="70" rx="12" fill="#fff8eb" stroke="#e4bd78"/>
  <text x="137" y="420" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#83551b">Lane list</text>
  <text x="137" y="442" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#866f4d">paths.txt</text>
  <rect x="214" y="392" width="126" height="70" rx="12" fill="#fff8eb" stroke="#e4bd78"/>
  <text x="277" y="420" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#83551b">FASTQ audit</text>
  <text x="277" y="442" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#866f4d">manifest.tsv</text>

  <!-- Inter-stage arrow 1 -->
  <line x1="372" y1="307" x2="388" y2="307" stroke="#6b7c79" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <circle cx="426" cy="151" r="17" fill="#397b6e"/>
  <text x="426" y="157" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="455" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#173f38">ALIGN</text>

  <rect x="426" y="196" width="282" height="56" rx="12" fill="#ffffff" stroke="#8aaba3" stroke-width="1.5"/>
  <text x="567" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#18594f">niptscale generate</text>

  <line x1="567" y1="252" x2="567" y2="282" stroke="#6b7c79" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="426" y="290" width="282" height="94" rx="14" fill="#eaf3f0" stroke="#9ac0b5"/>
  <text x="567" y="320" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#214f47">Lane × sample parallelism</text>
  <text x="567" y="346" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#526d68">BWA aln / samse</text>
  <text x="567" y="368" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#526d68">SAMtools sort / markdup / QC</text>

  <line x1="567" y1="384" x2="567" y2="414" stroke="#6b7c79" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="426" y="422" width="282" height="56" rx="12" fill="#fff8eb" stroke="#e4bd78"/>
  <text x="567" y="447" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#83551b">Sample BAM + BAI</text>
  <text x="567" y="466" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#866f4d">Lane-level bam.list</text>

  <!-- Inter-stage arrow 2 -->
  <line x1="742" y1="307" x2="758" y2="307" stroke="#6b7c79" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <circle cx="796" cy="151" r="17" fill="#bf7422"/>
  <text x="796" y="157" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="825" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#173f38">CALL VARIANTS</text>

  <rect x="796" y="196" width="328" height="62" rx="12" fill="#eaf3f0" stroke="#9ac0b5"/>
  <text x="960" y="220" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#214f47">BaseVar2 regional calling</text>
  <text x="960" y="242" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#5c736f">quality-filtered Lane cohort</text>

  <path d="M960 258 V286 H870 V306" fill="none" stroke="#6b7c79" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M960 258 V286 H1050 V306" fill="none" stroke="#6b7c79" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="796" y="314" width="148" height="82" rx="12" fill="#ffffff" stroke="#8aaba3"/>
  <text x="870" y="342" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#18594f">Optional test</text>
  <text x="870" y="365" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#667a76">chr20 region</text>
  <text x="870" y="383" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#667a76">QC VCF</text>

  <rect x="976" y="314" width="148" height="82" rx="12" fill="#ffffff" stroke="#8aaba3"/>
  <text x="1050" y="342" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#18594f">Whole genome</text>
  <text x="1050" y="365" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#667a76">regional VCFs</text>
  <text x="1050" y="383" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#667a76">ordered concat</text>

  <line x1="1050" y1="396" x2="1050" y2="422" stroke="#6b7c79" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="886" y="430" width="238" height="48" rx="12" fill="#18594f"/>
  <text x="1005" y="460" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Lane VCF.gz + TBI</text>

  <!-- Footer -->
  <text x="600" y="532" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#71827f">Every stage writes independent commands, logs, and done / failed markers</text>
</svg>
