<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">NIPTScale</title>
  <desc id="desc">NIPTScale logo combining a DNA helix with scalable genomic data blocks.</desc>
  <rect width="1200" height="240" fill="#ffffff"/>

  <!-- DNA and data mark -->
  <g transform="translate(54 38)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20 C88 20 84 144 162 144 C232 144 238 20 306 20" stroke="#18594f" stroke-width="14"/>
    <path d="M12 144 C88 144 84 20 162 20 C232 20 238 144 306 144" stroke="#75ad9c" stroke-width="14"/>
    <g stroke="#397b6e" stroke-width="7">
      <path d="M55 43 L78 69"/>
      <path d="M88 95 L111 121"/>
      <path d="M213 43 L236 69"/>
      <path d="M180 95 L203 121"/>
    </g>
    <g transform="translate(330 35)">
      <rect x="0" y="64" width="25" height="25" rx="5" fill="#e3a23b" stroke="none"/>
      <rect x="38" y="42" width="35" height="47" rx="6" fill="#d58c2c" stroke="none"/>
      <rect x="86" y="12" width="45" height="77" rx="7" fill="#bf7422" stroke="none"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="550" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="750" letter-spacing="-2" fill="#153f39">NIPT<tspan fill="#397b6e">Scale</tspan></text>
  <rect x="554" y="137" width="52" height="4" rx="2" fill="#d58c2c"/>
  <text x="622" y="148" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3.2" fill="#526b67">SCALABLE LOW-PASS WGS-NIPT</text>
  <text x="554" y="184" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="0.8" fill="#7a8b88">discover · align · call · track</text>
</svg>
