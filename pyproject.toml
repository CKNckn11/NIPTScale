[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niptscale"
version = "0.2.0"
description = "Scalable analysis framework for single-end low-pass WGS-NIPT"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kangnan Chen"}]
keywords = ["NIPT", "cfDNA", "low-pass WGS", "BaseVar2", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CKNckn11/NIPTScale"
Repository = "https://github.com/CKNckn11/NIPTScale.git"
Issues = "https://github.com/CKNckn11/NIPTScale/issues"
Documentation = "https://github.com/CKNckn11/NIPTScale#readme"

[project.scripts]
niptscale = "niptscale.cli:main"
niptflow = "niptscale.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
niptscale = ["scripts/*.sh"]
